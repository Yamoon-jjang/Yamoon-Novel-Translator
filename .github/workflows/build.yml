name: Build Yamoon Novel Translator (Windows Portable)

on:
  workflow_dispatch:
    inputs:
      refresh_release:
        description: '같은 버전 재배포: 이미 있는 릴리스의 zip·안내문을 이 빌드로 바꾸고 태그를 이 커밋으로 옮김'
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.gitattributes'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write   # only used by the release step on a v* tag push
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: 'pip'
          cache-dependency-path: app/requirements-build.txt
      - name: Verify exact source manifest
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "from pathlib import Path; import hashlib; root=Path('.'); lines=Path('PACKAGE_MANIFEST.sha256').read_text(encoding='utf-8').splitlines(); exp={line.split('  ',1)[1]:line.split('  ',1)[0] for line in lines if line.strip()}; actual={p.as_posix()[2:] if p.as_posix().startswith('./') else p.as_posix() for p in root.rglob('*') if p.is_file() and p.name!='PACKAGE_MANIFEST.sha256'}; assert set(exp)==actual, (set(exp)-actual,actual-set(exp)); bad=[p for p,h in exp.items() if hashlib.sha256((root/p).read_bytes()).hexdigest()!=h]; assert not bad,bad; print('SOURCE_MANIFEST=PASS',len(exp))"
          if ($LASTEXITCODE -ne 0) { throw 'Source manifest failed' }
      - name: Install Windows build dependencies
        shell: pwsh
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency install failed' }
          # Windows Smart App Control blocks unsigned native modules it does not know.
          # charset-normalizer's binary wheel ships unsigned .pyd speedups, so use its
          # pure-Python build (same API, used only by requests for encoding guesses).
          python -m pip install --force-reinstall --no-deps --no-binary charset-normalizer "charset-normalizer>=3.3,<4"
          if ($LASTEXITCODE -ne 0) { throw 'Pure charset-normalizer install failed' }
          python -c "import charset_normalizer, pathlib; d=pathlib.Path(charset_normalizer.__file__).parent; bad=[p.name for p in d.rglob('*') if p.suffix.lower() in ('.pyd','.dll')]; assert not bad, bad; print('CHARSET_PURE=PASS', charset_normalizer.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'charset-normalizer still has native modules' }
      - name: Run full 13-gate Windows build
        shell: pwsh
        working-directory: app
        # A hung gate (e.g. a modal dialog nobody can close) must fail fast
        # instead of consuming the whole job time limit. On failure or hang the
        # last log lines are attached as an annotation (readable through the API).
        timeout-minutes: 25
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build_log.txt'
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/d','/c',"build_windows.bat > `"$log`" 2>&1" -NoNewWindow -PassThru
          if (-not $p.WaitForExit(20 * 60 * 1000)) {
            & taskkill /T /F /PID $p.Id | Out-Null
            $code = 124
            Add-Content $log 'BUILD_TIMEOUT: a gate did not finish within 20 minutes'
          } else {
            $p.WaitForExit()
            $code = $p.ExitCode
          }
          Get-Content $log | Write-Output
          if ($code -ne 0) {
            $tail = (Get-Content $log -Tail 60) -join "`n"
            $tail = $tail.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error title=Build failed (exit $code)::$tail"
            exit 1
          }
      - name: Verify embedded build identity
        shell: pwsh
        working-directory: app
        run: |
          $info=Get-Content 'novel_translator/build_info.json' -Raw | ConvertFrom-Json
          if ($info.source_commit -ne $env:GITHUB_SHA) { throw 'Embedded source commit does not match GitHub Actions SHA' }
          if ([string]$info.github_run_id -ne [string]$env:GITHUB_RUN_ID) { throw 'Embedded run ID mismatch' }
          Write-Output ("BUILD_IDENTITY=PASS sha=" + $info.source_commit.Substring(0,8) + " run=" + $info.github_run_id)
      - name: Verify v2.2 Windows EXE file version
        shell: pwsh
        working-directory: app
        run: |
          $v=(Get-Item 'dist/NovelTranslator/NovelTranslator.exe').VersionInfo
          Write-Output ("EXE_VERSION=" + $v.FileVersion + " PRODUCT_VERSION=" + $v.ProductVersion)
          if ($v.FileVersion -ne '2.2.0.0' -or -not $v.ProductVersion.StartsWith('2.2')) { throw 'EXE version resource must be v2.2' }
      - name: Check signatures of bundled native files
        shell: pwsh
        working-directory: app
        # Smart App Control blocks unsigned DLL/PYD files with no reputation ("일부 기능 차단").
        # Only our own NovelTranslator.exe may be unsigned (no code-signing certificate).
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem dist/NovelTranslator -Recurse -File -Include *.dll,*.pyd,*.exe
          $unsigned = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' -and $_.Name -ne 'NovelTranslator.exe' }
          Write-Output ("SIGNATURE_CHECK files={0} unsigned_other={1}" -f $files.Count, @($unsigned).Count)
          if (@($unsigned).Count -gt 0) {
            $unsigned | ForEach-Object { Write-Output ("UNSIGNED " + $_.FullName) }
            throw 'Unsigned native files would be blocked by Smart App Control'
          }
      - name: Check removal of the web mark on real NTFS
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          $d = Join-Path $env:RUNNER_TEMP 'marktest'; New-Item -ItemType Directory -Force (Join-Path $d 'sub') | Out-Null
          foreach ($f in 'a.exe','sub\b.dll') { $p = Join-Path $d $f; Set-Content $p 'x'; Set-Content -Path $p -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          python -c "import sys; sys.path.insert(0,'.'); from novel_translator.web_mark import clear_marks, _has_mark; import os; d=sys.argv[1]; exe=os.path.join(d,'a.exe'); assert _has_mark(exe); n=clear_marks(d,last=exe); assert n==2,n; assert not _has_mark(exe) and not _has_mark(os.path.join(d,'sub','b.dll')); print('WEB_MARK=PASS',n)" $d
          if ($LASTEXITCODE -ne 0) { throw 'web mark removal failed' }
          $left = Get-ChildItem $d -Recurse -File | ForEach-Object { Get-Item $_.FullName -Stream * } | Where-Object Stream -eq 'Zone.Identifier'
          if ($left) { throw 'Zone.Identifier still present' }
      - name: Upload tested portable folder
        uses: actions/upload-artifact@v4
        with:
          name: NovelTranslator-v2.2-Windows-Portable
          path: app/dist/NovelTranslator/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Publish GitHub Release (new version on main only; push or manual run)
        # After every gate above has passed on main: if no release exists yet for the
        # version in app/novel_translator/__init__.py, create the tag and the release
        # with the tested portable folder. Existing releases are never touched, except by a
        # manual run with refresh_release checked (same-version redeploy of a fixed build).
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_release && 'true' || 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Select-String -Path 'app/novel_translator/__init__.py' -Pattern "VERSION_LABEL\s*=\s*'([^']+)'"
          if (-not $m) { throw 'VERSION_LABEL not found' }
          $tag = $m.Matches[0].Groups[1].Value
          $notes = ".github/release-notes/$tag.md"
          $zip = Join-Path $env:RUNNER_TEMP "Yamoon-Novel-Translator-$tag-Windows-Portable.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            if ($env:REFRESH -ne 'true') { Write-Output "RELEASE_EXISTS=$tag (skipped)"; exit 0 }
            # Manual run with refresh_release: same version, fixed build. Replace the zip and
            # notes and point the tag at this commit; the release itself (URL) stays.
            if (-not (Test-Path $notes)) { throw "NO_RELEASE_NOTES=$notes" }
            Compress-Archive -Path 'app/dist/NovelTranslator' -DestinationPath $zip
            git tag -f $tag $env:GITHUB_SHA
            git push -f origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'tag move failed' }
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
            gh release edit $tag --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'gh release edit failed' }
            Write-Output "RELEASE_REFRESHED=$tag sha=$env:GITHUB_SHA"
            exit 0
          }
          if (-not (Test-Path $notes)) { Write-Output "NO_RELEASE_NOTES=$notes (skipped)"; exit 0 }
          Compress-Archive -Path 'app/dist/NovelTranslator' -DestinationPath $zip
          gh release create $tag $zip --target $env:GITHUB_SHA --title "야문 Novel Translator $tag" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          Write-Output "RELEASE_CREATED=$tag"
